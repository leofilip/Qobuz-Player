[package]
name = "qobuz-player"
version = "0.5.3"
description = "Web Container for Qobuz Web Player"
authors = ["Leonardo Calé"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.5.2"
tauri-plugin-single-instance = "2.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22"
raw-window-handle = "0.6.2"
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
tauri-plugin-media = "0.1.1"
winreg = "0.52"
windows = {version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Media_Control",
    "Media_Playback",
    "Foundation",
    "Foundation_Collections"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
